# Déploiement automatique sur Cloudflare à chaque « push » sur main.
# Secrets du dépôt (Settings → Secrets and variables → Actions) :
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Variables du dépôt :
#   EXPO_PUBLIC_API_URL, EXPO_PUBLIC_ADSENSE_CLIENT, EXPO_PUBLIC_ADSENSE_SLOT, EXPO_PUBLIC_SITE_URL
name: Déploiement
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: worker } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm test
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

  site:
    runs-on: ubuntu-latest
    needs: api
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run build:web
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_ADSENSE_CLIENT: ${{ vars.EXPO_PUBLIC_ADSENSE_CLIENT }}
          EXPO_PUBLIC_ADSENSE_SLOT: ${{ vars.EXPO_PUBLIC_ADSENSE_SLOT }}
          EXPO_PUBLIC_SITE_URL: ${{ vars.EXPO_PUBLIC_SITE_URL }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy
